<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600&family=Michroma&family=Red+Hat+Display:wght@300..700&family=Valley+Sans&display=swap"><style>body{margin:0}
@keyframes floatBlob{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(1deg)}}
@keyframes bgPan{0%{transform:scale(1.08) translate(0,0)}50%{transform:scale(1.16) translate(-1.5%,-1%)}100%{transform:scale(1.08) translate(0,0)}}
@keyframes sheenSlide{0%{transform:translateX(-40%) rotate(10deg)}100%{transform:translateX(140%) rotate(10deg)}}
@keyframes gradientFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes sphereRotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes particleDrift{0%{transform:translate(var(--sx),var(--sy));opacity:0}15%{opacity:0.45}90%{opacity:0.3}100%{transform:translate(var(--ex),var(--ey));opacity:0}}
@keyframes coreBreathe{0%,100%{opacity:0.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes shimmerFlow{0%{stroke-dashoffset:120}100%{stroke-dashoffset:0}}
@keyframes twinkleStar{0%{opacity:0;transform:scale(0.3) rotate(0deg)}50%{opacity:var(--peak,1);transform:scale(1) rotate(45deg)}100%{opacity:0;transform:scale(0.3) rotate(90deg)}}
.hero-star{animation-name:twinkleStar;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@media (prefers-reduced-motion: reduce){.hero-star{animation:none!important;opacity:0.5!important}}
@keyframes blobDrift{0%{transform:translate(0,0) scale(var(--smin,1))}50%{transform:translate(var(--dx),var(--dy)) scale(var(--smax,1.2))}100%{transform:translate(0,0) scale(var(--smin,1))}}
.hero-blob{animation-name:blobDrift;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@media (prefers-reduced-motion: reduce){.hero-blob{animation:none!important}}
@keyframes silkDrift{0%{transform:translate(0,0) rotate(0deg) scale(1)}50%{transform:translate(-1.5%,1%) rotate(0.6deg) scale(1.02)}100%{transform:translate(0,0) rotate(0deg) scale(1)}}
.hero-silk{transform-origin:50% 50%}
@media (prefers-reduced-motion: reduce){.hero-silk{animation:none!important}}
@keyframes silkSway{0%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(6px) rotate(0.4deg)}100%{transform:translateX(0) rotate(0deg)}}
.hero-silk-vflow{animation:silkSway 8s ease-in-out infinite;transform-origin:50% 0%}
@media (prefers-reduced-motion: reduce){.hero-silk-vflow{animation:none!important}}
@keyframes caseImgSlideIn{0%{opacity:0;transform:translateY(28px)}100%{opacity:1;transform:translateY(0)}}
@keyframes caseTextFadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes caseModalWipeIn{0%{clip-path:inset(100% 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
@keyframes caseModalBlurFadeOut{0%{opacity:1;filter:blur(0)}100%{opacity:0;filter:blur(16px)}}
@keyframes caseModalBackdropIn{0%{opacity:0}100%{opacity:1}}
@keyframes caseModalBackdropOut{0%{opacity:1}100%{opacity:0}}
</style><script src="./image-slot.js?v=20261007d"></script><script src="./data.js?v=20261007d"></script><script src="./i18n.js?v=20261007d"></script></helmet>
<div style="background:var(--surface);font-family:var(--font-sans);min-height:100vh">
<x-import component-from-global-scope="SiteHeader" from="./Header.jsx?v=20261007d" active="{{screen}}" onNav="{{nav}}" hint-size="100%,64px"></x-import>
<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<x-import component-from-global-scope="PortfolioHero" from="./Hero.jsx?v=20261007d" onNav="{{nav}}" hint-size="100%,480px"></x-import>
<x-import component-from-global-scope="LunaProjectGrid" from="./ProjectGrid.jsx?v=20261007d" onOpen="{{openProject}}" hint-size="100%,700px"></x-import>
<x-import component-from-global-scope="WhatIBring" from="./WhatIBring.jsx?v=20261007d" hint-size="100%,260px"></x-import>
</sc-if>
<sc-if value="{{isWork}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="LunaProjectGrid" from="./ProjectGrid.jsx?v=20261007d" onOpen="{{openProject}}" hint-size="100%,700px"></x-import>
</sc-if>
<sc-if value="{{isCase}}" hint-placeholder-val="{{false}}">
<div style="position:fixed;inset:0;z-index:1100;overscroll-behavior:none;background:rgba(20,20,22,0.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:{{backdropAnim}}" onClick="{{backToWork}}">
<div style="position:absolute;top:56px;left:0;right:0;bottom:0;background:{{caseBg}};overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;animation:{{modalAnim}}" onClick="{{stopPropagation}}">
<x-import component-from-global-scope="PortfolioCaseStudy" from="./CaseStudy.jsx?v=20261007d" project="{{project}}" onBack="{{backToWork}}" onOpenOther="{{openProject}}" hint-size="100%,800px"></x-import>
</div>
</div>
</sc-if>
<sc-if value="{{isAbout}}" hint-placeholder-val="{{false}}">
<x-import component-from-global-scope="SiteAbout" from="./About.jsx?v=20261007d" hint-size="100%,500px"></x-import>
</sc-if>
<x-import component-from-global-scope="SiteFooter" from="./Footer.jsx?v=20261007d" hint-size="100%,72px"></x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { screen: 'Home', project: null, closing: false };
  savedScrollY = 0;
  scrollLocked = false;

  // Freeze the page behind the case study modal (position:fixed also works on iOS Safari)
  lockScroll = () => {
    if (this.scrollLocked) return;
    this.scrollLocked = true;
    this.savedScrollY = window.scrollY;
    const b = document.body.style;
    b.position = 'fixed'; b.top = -this.savedScrollY + 'px'; b.left = '0'; b.right = '0'; b.overflow = 'hidden';
  };
  unlockScroll = () => {
    if (!this.scrollLocked) return;
    this.scrollLocked = false;
    const b = document.body.style;
    b.position = ''; b.top = ''; b.left = ''; b.right = ''; b.overflow = '';
    window.scrollTo(0, this.savedScrollY);
  };

  nav = (s) => {
    this.unlockScroll();
    if (s === 'Work') {
      const go = () => { const el = document.getElementById('project-grid-section'); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 64, behavior: 'smooth' }); };
      if (this.state.screen !== 'Home' && this.state.screen !== 'Work' || this.state.project) { this.setState({ screen: 'Home', project: null, closing: false }, () => setTimeout(go, 80)); }
      else { this.setState({ screen: 'Home' }); go(); }
      return;
    }
    this.setState({ screen: s, project: null, closing: false }); window.scrollTo(0, 0);
  };
  stopPropagation = (e) => { e.stopPropagation(); };
  openProject = (p) => { this.lockScroll(); this.setState({ project: p, closing: false }); };
  backToWork = () => {
    this.setState({ closing: true });
    setTimeout(() => {
      this.setState({ project: null, closing: false });
      this.unlockScroll();
    }, 1100);
  };

  renderVals() {
    const { screen, project, closing } = this.state;
    return {
      screen,
      project,
      caseBg: project && project.dark ? '#0E0E10' : 'var(--surface)',
      nav: this.nav,
      stopPropagation: this.stopPropagation,
      openProject: this.openProject,
      backToWork: this.backToWork,
      modalAnim: closing ? 'caseModalBlurFadeOut 1.1s ease forwards' : 'caseModalWipeIn 0.8s cubic-bezier(0.65,0,0.35,1)',
      backdropAnim: closing ? 'caseModalBackdropOut 1.1s ease forwards' : 'caseModalBackdropIn 0.3s ease',
      isHome: screen === 'Home',
      isWork: screen === 'Work',
      isCase: !!project || closing,
      isAbout: screen === 'About',
      isContact: screen === 'Contact',
    };
  }
}
</script>
</body>
</html>
